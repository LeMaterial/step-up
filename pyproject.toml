[project]
name = "step-up"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siddharth Betala", email = "betalas5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C90", "UP", "RUF"]
ignore = [
    "E203",  # Whitespace before ':'; harmless to ignore if you are Black-compatible
]
fixable = ["ALL"]
unfixable = []
[tool.ruff.lint.mccabe]
max-complexity = 12
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
