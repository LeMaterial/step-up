# Heavy-atom BOSTMC: configs/bostmc.yaml with hydrogens dropped.
# complexes), with the model conditioned on charge and spin so the two manifolds
# are distinguishable.
#
# Data is the filtered release, which drops structures whose molecular graph
# changed during optimization and deduplicates by initial graph hash, keeping the
# best-R-factor representative.
#
# Split: the project's own random split (seed 0, 80/10/10 by refcode) from
# datasets/filtered/splits/random, which covers all 121,496 low-spin rows. The
# similarity ("spectral") split under splits/spectral is the planned follow-up.
dataset_path: /home/gridsan/jtoney/BOSTMC/datasets/filtered/BOSTMC-low-spin.csv
dataset_source: mol2
subset_size: null
id_column: refcode
split_files:
  train: /home/gridsan/jtoney/BOSTMC/datasets/filtered/splits/random/train-random.csv
  val: /home/gridsan/jtoney/BOSTMC/datasets/filtered/splits/random/val-random.csv
  test: /home/gridsan/jtoney/BOSTMC/datasets/filtered/splits/random/test-random.csv

# Charges span -8..+8 and spin multiplicity is 1 or 2. Both enter as scalars, so
# rare charge states still inform the model and inference isn't restricted to the
# combinations seen in training.
charge_column: charge
spin_column: spinmult

n_layers: 8
d_model: 512
d_ffn: 1024
n_head: 8
dropout: 0.0

# Optimization as in ReBind's rebind.sh (see README for the fp16 exception).
epochs: 20
batch_size: 100
eval_batch_size: 100
lr: 9.0e-5
weight_decay: 0.0
warmup_ratio: 0.1
adam_beta1: 0.9
adam_beta2: 0.99
adam_eps: 1.0e-8
lr_schedule: linear
grad_clip: 1.0
drop_last: true
num_workers: 4

device: cuda
output_dir: outputs/bostmc_full_noh
seed: 42

# Heavy-atom variant: hydrogens are dropped from the graph, so the model never
# sees or predicts them. Paired with configs/bostmc.yaml to separate "the model is
# bad at hydrogen" from "the model is bad at geometry". Each heavy atom keeps its
# hydrogen count in the numH feature, so the graph is not missing the chemistry,
# only the positions. Note this departs from the published setup, which keeps
# hydrogen explicit, so it is not a reproduction run.
remove_hs: true
