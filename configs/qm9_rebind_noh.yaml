# Heavy-atom QM9: the ReBind QM9 setup with hydrogens dropped from the graph.
# Not a reproduction of their published numbers — see the remove_hs note below.
# (paper, test split: D-MAE 0.254, D-RMSE 0.446, C-RMSD 0.321).
#
# Data is the QM9 copy ReBind and GTMGC trained on (HuggingFace RichXuOvO/HFQm9),
# converted by scripts/prepare_qm9_rebind.py. Molblocks are copied out of gdb9.sdf
# verbatim, so bonds are the published ones rather than re-perceived from geometry,
# and the CSV carries their published split (110,000 / 10,000 / 10,831).
#
# Hyperparameters follow external/ReBIND/experiments/conformer_prediction/rebind.sh;
# see README for the few places the loop still differs from their script.
dataset_path: /home/gridsan/jtoney/step-up-data/qm9/qm9-rebind.csv
dataset_source: sdf
subset_size: null
id_column: mol_id
split_column: split
# About 1.4% of records fail RDKit sanitization and are dropped, as in ReBind's
# own evaluation; fail the run if that rate jumps.
max_drop_fraction: 0.05

n_layers: 8
d_model: 512
d_ffn: 1024
n_head: 8
dropout: 0.0

# Optimization, verbatim from rebind.sh (fp16 is the one setting we don't mirror;
# we train in fp32, which is the more precise choice — see README).
epochs: 20
batch_size: 100
eval_batch_size: 100
lr: 9.0e-5
weight_decay: 0.0
warmup_ratio: 0.1
adam_beta1: 0.9
adam_beta2: 0.99
adam_eps: 1.0e-8
lr_schedule: linear
grad_clip: 1.0
drop_last: true
num_workers: 4

device: cuda
output_dir: outputs/qm9_rebind_noh
seed: 42

# Heavy-atom variant: hydrogens are dropped from the graph, so the model never
# sees or predicts them. Paired with configs/qm9_rebind.yaml to separate "the model is
# bad at hydrogen" from "the model is bad at geometry". Each heavy atom keeps its
# hydrogen count in the numH feature, so the graph is not missing the chemistry,
# only the positions. Note this departs from the published setup, which keeps
# hydrogen explicit, so it is not a reproduction run.
remove_hs: true
